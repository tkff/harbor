[package]
name = "harbor"
version = "0.4.0"
description = "A local-first SSH workspace with a KeePass-compatible vault"
edition = "2021"
license = "MIT"
default-run = "harbor"

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keepass = { version = "=0.17.0", features = ["save_kdbx4"] }
russh = { version = "=0.65.4", default-features = false, features = ["ring", "rsa"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
sha2 = "0.10"
tempfile = "3"
anyhow = "1"
rust-argon2 = "3"
aes-gcm = "0.10"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
rand = "0.10"
